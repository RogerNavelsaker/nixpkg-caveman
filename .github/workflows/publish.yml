name: Publish Caveman image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build image
        run: nix build .#caveman-image --out-link /tmp/caveman-image --print-build-logs
      - name: Load and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/rogernavelsaker/agent-services-caveman
        run: |
          set -euo pipefail
          docker load --input /tmp/caveman-image
          docker login ghcr.io --username "$GHCR_USER" --password "$GHCR_TOKEN"
          docker tag agent-services-caveman:latest "$IMAGE:latest"
          docker tag agent-services-caveman:latest "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
